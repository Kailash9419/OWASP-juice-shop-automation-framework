name: Selenium Hybrid Framework CI
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Start Juice Shop with Docker
        run: |
          docker run -d -p 3000:3000 --name juice-shop bkimminich/juice-shop
          
          echo "Waiting for container to initialize..."
          sleep 15
          
          echo "Checking if Juice Shop is ready..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 3 http://localhost:3000 2>/dev/null)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Juice Shop is ready! (attempt $i)"
              break
            fi
            echo "Attempt $i/30: Status=$STATUS, waiting 3s..."
            sleep 3
          done
          
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 http://localhost:3000 2>/dev/null)
          if [ "$STATUS" != "200" ]; then
            echo "❌ Juice Shop failed to start!"
            docker logs juice-shop
            exit 1
          fi
          
          sleep 5
          echo "🚀 Juice Shop fully ready!"

      - name: Register Test User in Juice Shop
        run: |
          echo "Registering test user..."
          
          RESPONSE=$(curl -s -X POST http://localhost:3000/api/Users \
            -H "Content-Type: application/json" \
            -d '{
              "email": "testuser@test.com",
              "password": "Test@123",
              "passwordRepeat": "Test@123",
              "securityQuestion": {"id": 1},
              "securityAnswer": "test"
            }')
          
          echo "Response: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"id"'; then
            echo "✅ Test user registered successfully!"
          else
            echo "❌ Registration FAILED!"
            exit 1
          fi

      - name: Run Automated Tests
        run: mvn clean test

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-reports-and-screenshots
          path: |
            screenshots/
            test-output/
            reports/
          retention-days: 5